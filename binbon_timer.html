<body>
<div class="header" id="hdr">
  <h1 id="hdr-title">☕ 빈본 로스팅 타이머</h1>
  <p id="hdr-sub">1차 팝 → 배출 시간 즉시 계산</p>
</div>
<div class="body" id="app"></div>
<div id="modal-area"></div>

<script>
let beansList=[],roastsList=[];
if(window.parent!==window)document.documentElement.classList.add('embedded');  // 커피 로그 안에서는 머리 여백 줄임

/* ── 지난 1팝 기록 (2026-11-04) ──
   로스팅 기록의 pop_time은 빈본 화면의 '잔여'(time_basis '진행'이면 경과 → 잔여로 환산).
   프로세스는 생두 목록의 process로 분류. 평균은 기록 5건 이상이면 IQR 이상치 제외 */
let _popRows=null;
function _sec(t){const p=String(t||'').trim().split(':');return p.length===2?(+p[0])*60+(+p[1]):null;}
function _norm(s){return String(s||'').toLowerCase().replace(/[\s\[\]().,·_#-]/g,'');}
function procGroup(p,name){
  const s=(p||'')+' '+(name||'');
  if(/anaerobic|무산소|carbonic|thermal|infus|double ferm/i.test(s))return '무산소';
  if(/natural|내추럴|cascada/i.test(s))return '내추럴';
  if(/honey|허니/i.test(s))return '허니';
  if(/wash|워시드/i.test(s))return '워시드';
  return '기타';
}
function findBeanFor(name){
  const k=_norm(name);
  return beansList.find(b=>b.name===name)||beansList.find(b=>_norm(b.name)===k)
    ||beansList.find(b=>{const bk=_norm(b.name);return bk.startsWith(k)||k.startsWith(bk);});
}
function popRows(){
  if(_popRows)return _popRows;
  _popRows=[];
  roastsList.forEach(r=>{
    const m=+r.mode;if(!MODES[m]||!r.pop_time)return;
    const ae=MODES[m].autoEject,t=_sec(r.pop_time);if(t===null)return;
    const rem=r.time_basis==='진행'?ae-t:t;if(!(rem>0&&rem<ae))return;
    const b=findBeanFor(r.bean_name);
    _popRows.push({m,rem,bean:b?b.name:r.bean_name,proc:procGroup(b&&b.process,r.bean_name)});
  });
  return _popRows;
}
function popAvg(list){
  let a=list.slice().sort((x,y)=>x-y);
  if(a.length>=5){const q=p=>{const i=(a.length-1)*p,l=Math.floor(i),h=Math.ceil(i);return a[l]+(a[h]-a[l])*(i-l);};
    const q1=q(.25),q3=q(.75),k=1.5*(q3-q1);a=a.filter(x=>x>=q1-k&&x<=q3+k);}
  return a.reduce((s,x)=>s+x,0)/a.length;
}
/* ── 예상 1팝 · 주의 (2026-11-07) ──
   같은 생두(같은 묶음 구매분 포함)+같은 모드 → 같은 생두 다른 모드 → 같은 모드+같은 프로세스 평균.
   1팝 시점을 믿기 어려운 옛 기록(pop_unreliable)은 뺌. 값은 경과(초) */
function beanFamily(name){
  const b=findBeanFor(name);if(!b)return {ids:new Set(),names:new Set([name])};
  const fam=beansList.filter(x=>x.id===b.id||(b.group_name&&x.group_name===b.group_name));
  return {ids:new Set(fam.map(x=>x.id)),names:new Set(fam.map(x=>x.name)),bean:b,multi:fam.length>1};
}
function roastInFamily(r,f){return r.bean_id?f.ids.has(r.bean_id):f.names.has(r.bean_name);}
function roastPopElapsed(r){
  const m=+r.mode;if(!MODES[m]||!r.pop_time)return null;
  const ae=MODES[m].autoEject,t=_sec(r.pop_time);if(t===null)return null;
  const rem=r.time_basis==='진행'?ae-t:t;if(!(rem>0&&rem<ae))return null;
  return ae-rem;
}
let _predKey='',_predVal=null;
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function predictPop(beanName,modeKey){
  const key=beanName+'|'+modeKey+'|'+roastsList.length;
  if(key===_predKey)return _predVal;
  _predKey=key;_predVal=null;
  if(!beanName)return null;
  const f=beanFamily(beanName),ae=MODES[modeKey].autoEject;
  const mine=roastsList.filter(r=>roastInFamily(r,f));
  const ok=mine.filter(r=>!r.pop_unreliable&&roastPopElapsed(r)!=null);
  const ord=a=>a.slice().sort((x,y)=>(x.date||'').localeCompare(y.date||'')||(+x.batch_no||0)-(+y.batch_no||0));
  const same=ord(ok.filter(r=>+r.mode===modeKey));
  const md=r=>{const p=String(r.date||'').split('-');return p.length===3?(+p[1])+'/'+(+p[2]):'';};
  let out=null;
  if(same.length){
    const last=same[same.length-1],els=same.map(roastPopElapsed),le=roastPopElapsed(last);
    const isToday=last.date===todayStr();
    out={point:le,min:isToday?le:Math.min(...els),max:isToday?le:Math.max(...els),n:same.length,
      src:isToday?`방금 #${last.batch_no||''} (오늘 같은 생두·${modeKey}번)`:`최근 ${md(last)} 같은 생두·${modeKey}번`+(same.length>1?` · 전체 ${same.length}회 잔여 ${fmt(ae-Math.min(...els))}~${fmt(ae-Math.max(...els))}`:'')};
  }else{
    const oth=ok.map(r=>({m:+r.mode,e:roastPopElapsed(r)}));
    if(oth.length){const es=oth.map(x=>x.e);out={point:null,min:Math.min(...es),max:Math.max(...es),n:oth.length,src:`같은 생두 다른 모드(${[...new Set(oth.map(x=>x.m))].sort().join('·')}번) 참고`};}
    else{
      const proc=procGroup(f.bean&&f.bean.process,beanName);
      const rows=popRows().filter(r=>r.m===modeKey&&r.proc===proc);
      if(rows.length){const avg=Math.round(ae-popAvg(rows.map(r=>r.rem)));out={point:avg,min:avg,max:avg,n:rows.length,src:`${modeKey}번·${proc} 평균 ${rows.length}회`};}
    }
  }
  const warns=[];
  const fp=mine.filter(r=>r.false_pop);
  if(fp.length){const pts=[].concat(...fp.map(r=>(r.false_pop_times||[]).map(t=>'잔여 '+t))).concat(fp.map(r=>r.false_pop_note).filter(Boolean));
    warns.push(`가짜 팝 있었음 ${fp.length}회${pts.length?' — '+[...new Set(pts)].join(' · '):''}`);}
  const wp=mine.filter(r=>r.weak_pop).length;if(wp)warns.push(`1팝 소리 약함 ${wp}회`);
  const ov=mine.filter(r=>+r.mode===modeKey&&r.dtr_over_target);
  _predVal=out||warns.length||ov.length?{...(out||{}),has:!!out,warns,overs:ov.map(r=>({t:+r.dtr_over_target,d:md(r)}))}:null;
  return _predVal;
}
/* 이 설정이 자동배출을 넘을지: 예상 1팝(가장 늦은 쪽)으로 낼 수 있는 최대 DTR, 지난 초과 기록 */
function overWarn(p){
  if(!p)return '';
  const ae=MODES[S.modeKey].autoEject,out=[];
  if(p.has){const lateRem=ae-(p.point!=null?p.point:p.max),mx=Math.floor(lateRem/ae*100);if(S.dtr>mx)out.push(`${S.modeKey}번 ${S.dtr}%는 자동배출을 넘을 수 있어요 (예상 최대 DTR ≈ ${mx}%)`);}
  const o=(p.overs||[]).filter(x=>x.t<=S.dtr);if(o.length)out.push(`지난 ${o.map(x=>x.d+' '+S.modeKey+'번 '+x.t+'%').join(', ')}: 자동배출 초과였어요`);
  return out.map(w=>`<div class="pred-warn">⚠ ${w} — 모드나 DTR을 바꿔 보세요</div>`).join('');
}
function predHtml(){
  const p=predictPop(S.beanName,S.modeKey);if(!p)return '';
  const ae=MODES[S.modeKey].autoEject;
  const rem=p.has?(p.point!=null?`<b>${fmt(ae-p.point)}</b>`:`<b>${fmt(ae-p.min)} ~ ${fmt(ae-p.max)}</b>`):'';
  return `<div class="pred-box">${p.has?`🔔 예상 1팝 잔여 ${rem}<div class="pred-src">${p.src}</div>`:''}${p.warns.map(w=>`<div class="pred-warn">⚠ ${w}</div>`).join('')}${overWarn(p)}</div>`;
}
// 모드 아래: 프로세스별 평균 1팝 (신규 생두 참고용)
function modePopHtml(){
  const rows=popRows().filter(r=>r.m===S.modeKey);
  if(!rows.length)return `<div class="pop-hist">이 모드는 아직 1팝 기록이 없어요</div>`;
  const parts=['워시드','내추럴','허니','무산소','기타'].map(p=>{
    const a=rows.filter(r=>r.proc===p).map(r=>r.rem);
    return a.length?`<span class="ph-item"><b>${p}</b> ${fmt(popAvg(a))} <small>${a.length}회</small></span>`:'';
  }).join('');
  return `<div class="pop-hist"><div class="ph-title">1팝 평균 (빈본 잔여)</div>${parts}</div>`;
}
// 생두 선택 아래: 이 생두의 지난 1팝
function beanPopHtml(){
  if(!S.beanName)return '';
  const all=popRows().filter(r=>r.bean===S.beanName);
  const b=beansList.find(x=>x.name===S.beanName);
  const proc=procGroup(b&&b.process,S.beanName);
  if(!all.length)return `<div class="pop-hist">이 생두는 1팝 기록이 없어요 — 위 <b>${proc}</b> 평균을 참고하세요</div>`;
  const cur=all.filter(r=>r.m===S.modeKey).map(r=>r.rem);
  const curHtml=cur.length
    ?`<div class="ph-main">${MODES[S.modeKey].label} 모드 1팝 평균 <b>${fmt(popAvg(cur))}</b> <small>(${cur.length}회${cur.length>1?`, ${fmt(Math.min(...cur))}~${fmt(Math.max(...cur))}`:''})</small></div>`
    :`<div class="ph-main">${MODES[S.modeKey].label} 모드로는 아직 안 볶았어요 — ${proc} 평균 참고</div>`;
  const others=[...new Set(all.map(r=>r.m))].filter(m=>m!==S.modeKey).sort((x,y)=>x-y).map(m=>{
    const a=all.filter(r=>r.m===m).map(r=>r.rem);
    return `<span class="ph-item" onclick="S.modeKey=${m};S.dtr=MODE_DTRS[${m}].list[0];render()">${m}번 ${fmt(popAvg(a))} <small>${a.length}회</small></span>`;
  }).join('');
  return `<div class="pop-hist"><div class="ph-title">이 생두의 지난 1팝 (빈본 잔여 · ${proc})</div>${curHtml}${others?`<div class="ph-other">다른 모드: ${others}</div>`:''}</div>`;

function fmt(s){

function calcEject(popSec,dtr,autoEject){

/* ── 아이폰 무음 모드에서도 소리 (2026-11-07) ──
   iOS는 무음 스위치가 켜져 있으면 웹 소리(Web Audio)를 끔 → 로스팅 시작·소리 확인 버튼을 누를 때
   ① 오디오 세션을 '재생'으로 지정(Safari 17+) ② 소리 없는 오디오를 반복 재생(옛 iOS용) 해서 음악처럼 나오게 함.
   동기 호출만 하고 기다리지 않음 → 시작 버튼 동작은 그대로 */
let _silentEl=null;
function silentWavURL(){
  const n=4000,buf=new Uint8Array(44+n),v=new DataView(buf.buffer);
  const w=(o,t)=>{for(let i=0;i<t.length;i++)buf[o+i]=t.charCodeAt(i);};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  buf.fill(128,44);let b='';buf.forEach(x=>b+=String.fromCharCode(x));return 'data:audio/wav;base64,'+btoa(b);
}
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  try{
    if(!_silentEl){_silentEl=new Audio(silentWavURL());_silentEl.loop=true;_silentEl.setAttribute('playsinline','');_silentEl.preload='auto';}
    const pr=_silentEl.play();if(pr&&pr.catch)pr.catch(()=>{});
  }catch(e){}
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state!=='running')audioCtx.resume();
  }catch(e){}
}
function stopSilentAudio(){try{if(_silentEl)_silentEl.pause();}catch(e){}}
function soundCheck(){unlockAudio();beep(880,0.18,0.9);setTimeout(()=>beep(1200,0.3,1),250);}
function beep(freq=880,dur=0.15,vol=0.7){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=freq;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

/* 1팝 예상 구간: 예상 최소 30초 전부터 (소리 1번) */
function inPopZone(){const p=S.predRun;return !!(p&&S.popElapsed===null&&S.elapsed>=p.min-30);}
function zoneTick(){if(inPopZone()&&!S.zoneAlerted){S.zoneAlerted=true;beep(1000,0.25,0.8);}}
function handlePop(){
  if(S.popElapsed!==null)return;

/* 가짜 팝이었을 때: 지금을 진짜 1팝으로. 앞 시점은 가짜로 남김. 1팝 직후 3초는 잠금 */
function realPopLockLeft(){return Math.max(0,3-Math.floor((Date.now()-(S.popAt||0))/1000));}
function handleRealPop(){
  if(S.screen!=='running'||S.popElapsed===null||realPopLockLeft()>0)return;
  (S.falsePops=S.falsePops||[]).push(S.popElapsed);
  S.popElapsed=S.elapsed;S.popAt=Date.now();S.earlyWarn=false;beep(660,0.2);
  startEjectCountdown();

function startEjectCountdown(){
  clearInterval(cdIv);S.countdown=null;S.countdownDone=false;
  const ae=MODES[S.modeKey].autoEject;
  S.result=calcEject(S.popElapsed,S.dtr,ae);
  if(!S.result.over){
    const target=S.result.ejSec;
    cdIv=setInterval(()=>{
      const left=target-Math.floor((Date.now()-startTime)/1000);
      S.countdown=left;
      if(left<=10&&left>0)beep(880,0.12,0.6);
      if(left<=0){
        clearInterval(cdIv);S.countdownDone=true;
        [0,500,1000,1500,2000,2500].forEach(t=>setTimeout(()=>beep(1200,0.4,1),t));
      }

}

function calcTimerDtrLoss(){
  const ae=MODES[S.modeKey].autoEject;
  const popSec=S.popElapsed;
  const ejSec=S.result?S.result.ejSec:null;
  let dtr=null,loss=null;
  if(popSec!==null&&S.result){
    dtr=S.result.over?((ae-popSec)/ae*100).toFixed(1):String(S.dtr);  // 목표대로면 목표값, 자동배출이면 1팝 잔여÷자동배출
  }
  const ig=parseFloat(S.inputG)||0;
  const og=parseFloat(S.outputG)||0;
  if(ig>0&&og>0) loss=((ig-og)/ig*100).toFixed(1);
  return{dtr,loss};
}

function sendRoastLog(){
  const ae=MODES[S.modeKey].autoEject;
  const {dtr,loss}=calcTimerDtrLoss();
  const popSec=S.popElapsed;
  const ejSec=S.result?S.result.ejSec:null;
  const fmtRem=s=>s!==null?fmt(ae-s):null;
  // 시작 = 로스팅 시작 버튼 누른 시각, 끝 = 배출 시각(계산된 배출, 1팝 없음/초과면 자동배출)
  const st=new Date(startTime||Date.now());
  const endSec=(S.result&&!S.result.over&&ejSec!==null)?ejSec:ae;
  const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const data={
    date:st.getFullYear()+'-'+String(st.getMonth()+1).padStart(2,'0')+'-'+String(st.getDate()).padStart(2,'0'),
    start_time:startTime?hm(st):'',
    end_time:startTime?hm(new Date(startTime+endSec*1000)):'',
    bean_name:S.beanName||'',
    mode:String(S.modeKey),
    input_g:S.inputG||'',
    output_g:S.outputG||'',
    pop_time:popSec!==null?fmtRem(popSec):'',
    // 목표가 자동배출을 넘으면(over) 자동배출 시점(잔여 0:00)에 나온 것 — 예전엔 음수가 양수로 뒤집혀 기록됐음
    eject_time:ejSec!==null?(S.result&&S.result.over?'0:00':fmtRem(ejSec)):'',
    dtr_target:(S.result&&!S.result.over)?String(S.dtr):'',
    eject_auto:!!(S.result&&S.result.over),
    dtr_over_target:(S.result&&S.result.over)?String(S.dtr):'',
    bean_short:shortBean(S.beanName),
    false_pop:(S.falsePops||[]).length>0,
    false_pop_times:(S.falsePops||[]).map(e=>fmt(ae-e)),
    dtr_pct:dtr||'',

  };
  window.parent.postMessage({type:'roast_done',data},'*');
}

// ── 로스팅 화면용: 선택 DTR 중심으로 3열만 추출 ──────────────
function getDisplayDtrs(dtrs,selectedDtr){
  if(dtrs.length<=3)return dtrs;
  const idx=dtrs.indexOf(selectedDtr);
  if(idx===-1)return dtrs.slice(0,3);
  let start=Math.max(0,idx-1);
  if(start+3>dtrs.length)start=dtrs.length-3;
  return dtrs.slice(start,start+3);
}

// ── 표 HTML (설정화면 모달: displayDtrs=null → 전체열 / 로스팅: 3열+wide) ──
function buildTableHtml(hitRemain,displayDtrs){
  const ae=MODES[S.modeKey].autoEject;
  const color="#7A3B10";
  const {rows,center}=POP_ROWS[S.modeKey];
  const dtrs=displayDtrs||MODE_DTRS[S.modeKey].list;
  const wide=!!displayDtrs;

  const rowsHtml=rows.map(pr=>{
    const popSec=ae-pr;
    const isRef=pr===center;
    const isHit=hitRemain!==null&&pr===hitRemain;
    let trClass=isHit?"is-hit":isRef?"is-ref":"";

    const cols=dtrs.map(dtr=>{
      const isSel=dtr===S.dtr;
      const {dev,rem,over,ejSec}=calcEject(popSec,dtr,ae);
      const remStr=over?`+${fmt(Math.abs(rem))}`:fmt(rem);
      const devBg=over?"#ffe0d0":(isSel?"#c8e8dc":"#e6f2ee");
      const devCol=over?"#c05000":color;
      return `<td class="${isSel?"sel-col":""}">
        <div class="dev-b" style="background:${devBg};color:${devCol}">${dev}초</div>
        <div class="rem-val${over?" over":""}">${remStr}</div>
        <div class="rem-sub-s">(${fmt(ejSec)})</div>
      </td>`;
    }).join("");

    const refB=isRef?`<div style="display:inline-block;background:${color};color:#fff;font-size:8px;font-weight:700;border-radius:3px;padding:1px 4px;margin-top:2px">기준</div>`:"";
    const hitB=isHit?`<div style="display:inline-block;background:#f57f17;color:#fff;font-size:8px;font-weight:700;border-radius:3px;padding:1px 4px;margin-top:2px">▶현재</div>`:"";

    return `<tr class="${trClass}" style="${isRef?`border-color:${color}`:""}">
      <td>
        <div class="pop-main" style="color:${color}">${fmt(pr)}</div>
        <div class="pop-sub-s">(${fmt(popSec)})</div>
        ${refB}${hitB}
      </td>${cols}
    </tr>`;
  }).join("");

  return `
    <div class="inline-table-wrap">
      <table class="itbl${wide?" wide":""}">
        <thead><tr>
          <th style="background:${color}">1차팝<br><span style="font-size:8px;opacity:0.8">남은(경과)</span></th>
          ${dtrs.map(d=>`<th class="${d===S.dtr?"sel-col":""}" style="background:${color};${d===S.dtr?'':'opacity:0.72;'}">DTR ${d}%${d===S.dtr?" ★":""}<br><span style="font-size:8px;opacity:0.85">발달·남은(경과)</span></th>`).join("")}
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
    <div class="tbl-warn">+표시 → 자동배출(${fmt(ae)}) 초과 · 강제배출 불가</div>
  `;
}

            <div class="modal-close" onclick="toggleTable()">✕</div>
          </div>
          <div class="modal-meta">자동배출 ${fmt(mode.autoEject)} · 남은시간 기준 · 괄호=경과 · ★=선택된 DTR</div>
          ${buildTableHtml(null)}
        </div>
      </div>`;
  } else {
    modalArea.innerHTML="";
  }

  if(S.screen==="setup"){
    hdr.style.background=color;
    hdr.style.display=document.documentElement.classList.contains('embedded')?'none':'';
    hdrT.textContent="☕ 빈본 로스팅 타이머";
    hdrS.textContent="1차 팝 → 배출 시간 즉시 계산";
    const dtrList=MODE_DTRS[S.modeKey].list;
    app.innerHTML=`
      ${beansList.length?`
      <div class="sec">
        <div class="lbl">생두</div>
        <select style="width:100%;padding:9px 10px;border-radius:8px;border:2px solid #ddd;font-size:13px;font-weight:600;color:#333;background:#fff;font-family:inherit" onchange="selectBean(this)">
          <option value="">선택 안 함</option>
          ${(()=>{
            // 재고 있는 생두: 원산지별 그룹 / 소진 생두: 맨 아래 별도 그룹 (2026-11-04)
            const byOrigin={};
            beansList.filter(b=>!isSoldOut(b)).forEach(b=>{
              const o=b.origin||"기타";
              (byOrigin[o]=byOrigin[o]||[]).push(b);
            });
            const opt=(b,suffix)=>`<option value="${b.name}"${S.beanName===b.name?' selected':''}>${b.name}${suffix}</option>`;
            const inStock=Object.keys(byOrigin).sort((a,b)=>a.localeCompare(b,"ko"))
              .map(origin=>{
                const beans=byOrigin[origin].slice().sort((a,b)=>a.name.localeCompare(b.name,"ko"));
                return `<optgroup label="${origin}">${beans.map(b=>opt(b,'')).join('')}</optgroup>`;
              }).join('');
            const soldOut=beansList.filter(isSoldOut).slice()
              .sort((a,b)=>(a.origin||"기타").localeCompare(b.origin||"기타","ko")||a.name.localeCompare(b.name,"ko"));
            return inStock+(soldOut.length?`<optgroup label="── 재고 없음 (소진) ──">${soldOut.map(b=>opt(b,' (소진)')).join('')}</optgroup>`:'');
          })()}
        </select>
        ${selectedSoldOut()?`<div style="margin-top:6px;padding:7px 10px;border-radius:8px;background:#fff3e0;color:#c05000;font-size:12px;font-weight:600">⚠ 재고가 소진된 생두예요.</div>`:''}
        <div class="set-sum">${mode.label} · DTR ${S.dtr}% · ${S.inputG||120}g <span>(자동배출 ${fmt(mode.autoEject)})</span></div>
        ${predHtml()}
      </div>`:``}
      <button class="start-btn" style="background:${color}" onclick="doStart()">▶ 로스팅 시작</button>
      <div class="detail-lbl">상세 설정</div>
      <div class="sec">
        <div class="lbl" style="display:flex;justify-content:space-between;align-items:center">빈본 모드<button class="snd-btn" onclick="soundCheck()">🔊 소리 확인</button></div>
        <div class="btn-row">
          ${Object.entries(MODES).map(([k,v])=>{
            const c=GROUP_COLOR[MODE_DTRS[+k].group];
            return `<button class="chip" style="${S.modeKey===+k?`background:${c};border-color:${c};color:#fff`:""}"
              onclick="S.modeKey=${k};S.dtr=MODE_DTRS[${k}].list[0];render()">${v.label}</button>`;
          }).join("")}
        </div>
        <div style="font-size:11px;color:#888;margin-top:8px">${group} 로스팅 · 자동배출 ${fmt(mode.autoEject)}</div>
        ${modePopHtml()}
        ${beanPopHtml()}
      </div>
      <div class="sec">
        <div class="lbl">DTR 목표</div>
        <div class="btn-row">
          ${dtrList.map(d=>`
            <button class="chip" style="${S.dtr===d?`background:${color};border-color:${color};color:#fff`:""}"
              onclick="S.dtr=${d};render()">${d}%</button>`).join("")}
        </div>
      </div>
      <div class="sec">
        <div class="lbl">투입량(g) <span style="color:#bbb;font-weight:400">(선택사항)</span></div>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="chip" onclick="S.inputG=String(Math.max(0,(+S.inputG||0)-10));render()">−10</button>
          <input type="number" value="${S.inputG}" placeholder="120"
            style="flex:1;min-width:0;padding:9px 10px;border-radius:8px;border:2px solid #ddd;font-size:15px;font-weight:700;text-align:center;font-family:inherit"
            oninput="S.inputG=this.value">
          <button class="chip" onclick="S.inputG=String(Math.max(0,(+S.inputG||0)+10));render()">+10</button>
        </div>
      </div>
      <button class="table-btn" style="border-color:${color};color:${color}" onclick="toggleTable()">
        📋 ${S.showTable?"표 닫기":"전체 표 보기"}</button>
    `;
  } else {
    // ── 로스팅 화면 ──
    const zone=inPopZone();
    const hdrBg=S.popElapsed!==null?(S.result?.over?"#e05c00":color):(zone?"#1565c0":"#333");
    hdr.style.background=hdrBg;hdr.style.display='';
    hdrT.textContent=`🔥 ${shortBean(S.beanName)||'로스팅'} · ${S.modeKey}-${S.dtr}`;
    hdrS.textContent=S.popElapsed===null?(zone?"🔔 1팝 예상 구간":"로스팅 중"):(S.result?.over?"⚠ 자동배출 초과":"✅ 1팝 → 배출 대기");
    const remDisplay=Math.max(0,mode.autoEject-S.elapsed);

    // 1차팝 하이라이트 행
    let hitRemain=null;
    if(S.popElapsed!==null){
      hitRemain=Math.round((mode.autoEject-S.popElapsed)/5)*5;
    }

    let resultHtml="";
    if(S.result){
      const r=S.result;
      const rc=r.over?"#e05c00":color;
      const rs=r.over?`+${fmt(Math.abs(r.rem))}`:fmt(r.rem);
      resultHtml=`
        <div class="result-mini">${r.over?`⚠ 목표 DTR ${S.dtr}%는 자동배출을 넘어요 — 자동배출에 나옴`:`발달시간 ${r.dev}초`}</div>
        ${!r.over?`
        <div class="cd-box" style="background:${S.countdownDone?"#e8f5e9":"#fffde7"};border-color:${S.countdownDone?"#4caf50":"#ffc107"}">
          ${S.countdownDone
            ?`<div class="cd-num" style="color:#4caf50">배출!</div><div class="cd-lbl">지금 배출하세요 🔔</div>`
            :`<div class="cd-num" style="color:#e65100">${S.countdown!==null?Math.max(0,S.countdown)+"초":"계산중..."}</div><div class="cd-lbl">배출까지 남은 시간</div>`}
        </div>`:""}`;
    }

    app.innerHTML=`
      <div class="timer-box">
        <div class="remain-lbl-main">빈본 잔여시간</div>
        <div class="remain-num">${fmt(remDisplay)}</div>
        ${S.popElapsed===null&&S.predRun?`<div class="zone-note" style="color:${zone?'#1565c0':'#999'}">${zone?'🔔 ':''}1팝 예상 잔여 ${S.predRun.point!=null?fmt(mode.autoEject-S.predRun.point)+' 쯤':fmt(mode.autoEject-S.predRun.min)+'~'+fmt(mode.autoEject-S.predRun.max)}</div>`:''}
      </div>
      ${S.popElapsed===null
        ?`<button class="pop-btn" style="background:${color};box-shadow:0 4px 16px ${color}55" onclick="handlePop()">🔊 1차 팝!</button>`
        :`<div class="big2"><div><div class="b2-l">1팝 잔여</div><div class="b2-n">${fmt(mode.autoEject-S.popElapsed)}</div></div>
           <div class="${S.result&&S.result.over?'over':''}"><div class="b2-l">${S.result&&S.result.over?'자동배출 초과':'배출 잔여'}</div><div class="b2-n">${S.result?(S.result.over?'0:00':fmt(S.result.rem)):'…'}</div></div></div>`}
      ${S.earlyWarn?`<div class="early-warn">예상보다 빠름 — 가짜 팝일 수 있음</div>`:''}
      ${resultHtml}
      ${S.popElapsed!==null&&!S.countdownDone?(()=>{const lk=realPopLockLeft();const n=(S.falsePops||[]).length;
        return `<div class="realpop-row">${n?`가짜 ${n}번 · `:''}가짜였으면 <button class="realpop-btn" ${lk?'disabled':''} onclick="handleRealPop()">${lk?lk+'…':'진짜 1팝'}</button></div>`;})():''}
      <div class="sec" style="padding:12px 10px;margin-bottom:12px">
        <div class="lbl" style="margin-bottom:6px">📋 ${mode.label}번 · ${group} · DTR ${S.dtr}% 기준표</div>
        ${buildTableHtml(hitRemain,getDisplayDtrs(MODE_DTRS[S.modeKey].list,S.dtr))}
      </div>
      ${S.countdownDone||S.result?.over?`
      <div style="background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.07)">
        <div style="font-size:11px;font-weight:700;color:#888;margin-bottom:10px;letter-spacing:0.5px">📋 로스트 로그 등록</div>
        ${(()=>{
          const ig=parseFloat(S.inputG)||0;
          const og=parseFloat(S.outputG)||(ig?Math.round(ig*0.9):0);
          if(!S.outputG&&ig) S.outputG=String(Math.round(ig*0.9));
          const {dtr,loss}=calcTimerDtrLoss();
          const presets=ig>0?[-4,-2,0,2,4].map(d=>Math.max(1,Math.round(ig*0.9+d))):[];
          return`
          <div style="font-size:11px;color:#666;margin-bottom:6px">배출량(g)</div>
          ${presets.length?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">
            ${presets.map(v=>`<button class="chip" style="${S.outputG==v?`background:${color};border-color:${color};color:#fff`:''}" onclick="setOutput('${v}')">${v}</button>`).join('')}
          </div>`:''}
          <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px">
            <button class="chip" onclick="adjOutput(-5)">−5</button>
            <button class="chip" onclick="adjOutput(-1)">−1</button>
            <input type="number" step="0.1" value="${S.outputG}" placeholder="${ig?Math.round(ig*0.9):''}"
              style="flex:1;min-width:0;padding:9px 10px;border-radius:8px;border:2px solid #ddd;font-size:15px;font-weight:700;text-align:center;font-family:inherit"
              oninput="S.outputG=this.value;render()">
            <button class="chip" onclick="adjOutput(1)">+1</button>
            <button class="chip" onclick="adjOutput(5)">+5</button>
          </div>
          <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px">
            <button class="chip" style="flex:1" onclick="adjOutput(-0.1)">−0.1g</button>
            <button class="chip" style="flex:1" onclick="adjOutput(0.1)">+0.1g</button>
          </div>
          <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px">
            ${dtr?`<span style="background:#7A3B1012;border:1px solid #7A3B1044;color:#7A3B10;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:700">DTR ${dtr}%</span>`:'<span style="background:#f0f0f0;padding:5px 12px;border-radius:6px;font-size:12px;color:#aaa">DTR — (1차팝 필요)</span>'}
            ${loss?`<span style="background:#e07b3012;border:1px solid #e07b3044;color:#e07b30;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:700">손실율 ${loss}%</span>`:(ig?'<span style="background:#f0f0f0;padding:5px 12px;border-radius:6px;font-size:12px;color:#aaa">배출량 입력 시 계산</span>':'')}
          </div>
          <button onclick="sendRoastLog()"
            style="width:100%;padding:14px;border-radius:12px;border:none;background:${color};color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit">
            ✅ 로스트 로그 등록
          </button>`;
        })()}
      </div>`:``}
      <button class="reset-btn" onclick="handleReset()">↩ 처음으로</button>
    `;
  }
}

// 화면을 다시 그릴 때마다 부모창 미니바에도 상태 전달
const _renderBase=render;
render=function(){_renderBase();postTimerState();postSetup();};

render();
</script>
</body>
</html>
